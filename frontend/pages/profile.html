<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử mua hàng - AuraCraft</title>
    <!-- Font Awesome (Dành cho Header & Footer Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/header-footer.css">
    <link rel="stylesheet" href="../assets/css/pages/profile.css">
    <style>
        .btn-view-detail {
            background-color: #425B9A !important;
            color: #ffffff !important;
            border: 1px solid #425B9A !important;
            font-weight: 600 !important;
            box-shadow: 0 2px 6px rgba(66, 91, 154, 0.2);
            transition: all 0.2s ease !important;
        }
        .btn-view-detail:hover {
            background-color: #334677 !important;
            border-color: #334677 !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(66, 91, 154, 0.3);
        }

        /* Định dạng in Biên lai / Hóa đơn sạch đẹp */
        @media print {
            body * {
                visibility: hidden;
            }
            #orderDetailModal, #orderDetailModal * {
                visibility: visible;
            }
            #orderDetailModal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: none !important;
                padding: 0 !important;
            }
            .order-modal-dialog {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
                max-width: 100% !important;
                width: 100% !important;
            }
            #btnCloseOrderModal, #btnPrintReceipt, #btnModalCloseAction {
                display: none !important;
            }
        }
    </style>
</head>
<body>
<div id="header-placeholder"></div>

<main class="profile-page-wrapper">
    <!-- Header thông tin người dùng -->
    <div class="profile-user-card">
        <div class="profile-user-left">
            <div class="profile-avatar-wrap">
                <img src="https://ui-avatars.com/api/?name=User&background=425B9A&color=fff&size=128" alt="Avatar Khách Hàng" id="userAvatarImg">
            </div>
            <div class="profile-user-info">
                <h2>
                    <span id="displayUserName">Tài khoản</span>
                    <a href="/profile-info" title="Chỉnh sửa hồ sơ" style="color: var(--primary-brown); font-size: 15px; margin-left: 4px;">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                </h2>
                <p id="displayUserEmail">Đang tải thông tin...</p>
                <span class="profile-user-badge"><i class="bi bi-patch-check"></i> Khách hàng AuraCraft</span>
            </div>
        </div>

        <div>
            <a href="products.html" class="btn btn-primary" style="padding: 8px 18px; font-size: 13.5px; border-radius: 8px;">
                <i class="bi bi-bag-plus"></i> Khám phá mua sắm
            </a>
        </div>
    </div>

    <!-- Layout 2 cột: Menu bên trái & Danh sách đơn hàng bên phải -->
    <div class="profile-grid-layout">
        <!-- Sidebar Menu -->
        <aside class="profile-sidebar">
            <ul class="profile-nav-menu">
                <li class="profile-nav-item">
                    <a href="profile-info.html">
                        <i class="bi bi-person"></i>
                        <span>Thông tin cá nhân</span>
                    </a>
                </li>
                <li class="profile-nav-item active">
                    <a href="profile.html">
                        <i class="bi bi-bag-check"></i>
                        <span>Đơn hàng đã mua</span>
                    </a>
                </li>
                <li class="profile-nav-item">
                    <a href="profile-favorites.html">
                        <i class="bi bi-heart"></i>
                        <span>Sản phẩm yêu thích</span>
                    </a>
                </li>
                <li class="profile-nav-item">
                    <a href="profile-quotes.html">
                        <i class="bi bi-chat-left-quote"></i>
                        <span>Yêu cầu & Báo giá</span>
                    </a>
                </li>
                <li class="profile-nav-item logout-item">
                    <a href="javascript:void(0)" data-action="logout">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Đăng xuất</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <section class="profile-main-content">
            <!-- Thanh Tab Bộ Lọc Trạng Thái Đơn Hàng -->
            <div class="orders-filter-bar" id="filterTabsBar">
                <button type="button" class="orders-filter-btn active" data-filter="ALL">
                    <span>Tất cả</span>
                    <span class="count-badge" id="countAll">0</span>
                </button>
                <button type="button" class="orders-filter-btn" data-filter="PROCESSING">
                    <span>Đang xử lý / Chế tác</span>
                    <span class="count-badge" id="countProcessing">0</span>
                </button>
                <button type="button" class="orders-filter-btn" data-filter="SHIPPING">
                    <span>Đang giao hàng</span>
                    <span class="count-badge" id="countShipping">0</span>
                </button>
                <button type="button" class="orders-filter-btn" data-filter="DELIVERED">
                    <span>Đã giao</span>
                    <span class="count-badge" id="countDelivered">0</span>
                </button>
                <button type="button" class="orders-filter-btn" data-filter="CANCELLED">
                    <span>Đã hủy</span>
                    <span class="count-badge" id="countCancelled">0</span>
                </button>
            </div>

            <!-- Danh sách đơn hàng (Nạp động từ JS & Backend API) -->
            <div id="ordersContainer">
                <div style="text-align: center; padding: 40px; color: var(--text-muted); background: #fff; border-radius: 12px; border: 1px solid #f0ece6;">
                    <i class="bi bi-arrow-repeat spin" style="font-size: 26px; color: var(--primary-blue);"></i>
                    <p style="margin-top: 10px; font-size: 14px;">Đang tải lịch sử đơn hàng...</p>
                </div>
            </div>
        </section>
    </div>
</main>

<!-- MODAL XEM CHI TIẾT ĐƠN HÀNG CHUYÊN NGHIỆP -->
<div class="order-modal-backdrop" id="orderDetailModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9999; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(3px);">
    <div class="order-modal-dialog" style="background:#ffffff; border-radius:16px; width:100%; max-width:680px; max-height:90vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,0.25); border:1px solid #ebdcd3; display:flex; flex-direction:column;">
        <div class="order-modal-header" style="padding:16px 20px; border-bottom:1px solid #f0ece6; display:flex; justify-content:space-between; align-items:center; background:#faf6f4; border-radius:16px 16px 0 0;">
            <div>
                <h3 style="margin:0; font-size:1.15rem; color:#425B9A; display:flex; align-items:center; gap:8px;">
                    <i class="bi bi-receipt-cutoff"></i> Chi Tiết Đơn Hàng <span id="modalOrderCode" style="color:#7b5144; font-weight:700;">#ORD-...</span>
                </h3>
                <p style="margin:3px 0 0; font-size:0.82rem; color:#888;" id="modalOrderDate">Đặt lúc ...</p>
            </div>
            <button type="button" id="btnCloseOrderModal" style="background:none; border:none; font-size:1.6rem; color:#888; cursor:pointer; line-height:1; padding:0 4px;" aria-label="Đóng">&times;</button>
        </div>
        <div class="order-modal-body" id="modalOrderContent" style="padding:20px; font-size:0.9rem;">
            <!-- Render tự động bởi profile-orders.js -->
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/profile-sync.js"></script>
<script src="../assets/js/profile-orders.js?v=20261119_v4"></script>
<script>
    fetch('../components/header.html')
        .then(r => r.text())
        .then(html => document.getElementById('header-placeholder').innerHTML = html.replace(/href="index\.html"/g, 'href="../index.html"'))
        .catch(err => console.error('Lỗi tải Header:', err));

    fetch('../components/footer.html')
        .then(r => r.text())
        .then(html => document.getElementById('footer-placeholder').innerHTML = html.replace(/href="index\.html"/g, 'href="../index.html"'))
        .catch(err => console.error('Lỗi tải Footer:', err));
</script>
<script src="../assets/js/popup.js"></script>
</body>
</html>
