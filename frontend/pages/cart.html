<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - AuraCraft</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/header-footer.css">
    <link rel="stylesheet" href="../assets/css/pages/styleCart.css">
    <style>
        .cart-group { margin-bottom: 20px; border: 1px solid var(--gray-light, #eee); border-radius: 10px; overflow: hidden; background: #fff; }
        .cart-shop-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #faf6f4; border-bottom: 1px solid var(--gray-light, #eee); font-weight: 600; color: #5a3e36; }
        .item-subtotal { font-weight: 700; color: var(--primary-brown, #7b5144); font-size: 15px; min-width: 90px; text-align: right; }
        .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0e8e3; }
        .summary-row.total-row { border-bottom: none; padding-top: 14px; font-size: 18px; }
        .summary-row.total-row .total-price { color: var(--primary-brown, #7b5144); font-size: 22px; font-weight: 700; }
        .checkout-btn { width: 100%; margin-top: 18px; font-size: 16px; padding: 14px; }
        .loading-msg { color: #888; }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="cart-page">
        <div class="container">
            <h1 class="section-title">Giỏ hàng của bạn</h1>

            <!-- Giỏ hàng sản phẩm - render bởi cart.js -->
            <div class="cart-items" id="cartItemsContainer">
                <p style="text-align:center;padding:40px;color:#888">
                    <i class="fa-solid fa-spinner fa-spin"></i> Đang tải giỏ hàng...
                </p>
            </div>

            <!-- Summary - render bởi cart.js -->
            <div class="cart-summary" id="cartSummary" style="display:none;margin-top:24px;padding:20px;background:#faf6f4;border-radius:12px;"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Scripts: auth.js trước rồi cart.js -->
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/popup.js"></script>
    <script>
        fetch('../components/header.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('header-placeholder').innerHTML =
                    html.replace(/href="index\.html"/g, 'href="../index.html"');
            });

        fetch('../components/footer.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('footer-placeholder').innerHTML =
                    html.replace(/href="index\.html"/g, 'href="../index.html"');
            });
    </script>
</body>
</html>
