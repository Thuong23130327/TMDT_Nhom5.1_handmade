server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/auracraft_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

auth.jwt.secret=${AURACRAFT_JWT_SECRET:AuraCraft-local-development-secret-change-before-deploy-2026}
auth.jwt.access-expiration-ms=86400000
auth.jwt.refresh-expiration-ms=604800000

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
auracraft.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}