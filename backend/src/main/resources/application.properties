server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/auracraft_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

auth.jwt.secret=${AURACRAFT_JWT_SECRET:AuraCraft-local-development-secret-change-before-deploy-2026}
auth.jwt.access-expiration-ms=86400000
auth.jwt.refresh-expiration-ms=604800000

