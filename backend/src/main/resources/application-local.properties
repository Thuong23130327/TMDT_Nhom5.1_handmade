spring.datasource.url=${AURACRAFT_DB_URL:jdbc:mysql://localhost:3306/auracraft_auth_local?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${AURACRAFT_DB_USERNAME:root}
spring.datasource.password=${AURACRAFT_DB_PASSWORD:}

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
auracraft.mail.from=${MAIL_FROM:dev@auracraft.local}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
